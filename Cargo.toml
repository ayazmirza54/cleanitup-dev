[package]
name = "cleanitup"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "c9ae2f6ec08147fc5c72760bbf09a6acd4a27dc3" }
fs4 = "0.13"
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "c9ae2f6ec08147fc5c72760bbf09a6acd4a27dc3" }
trash = "5"

# Rune builds against patched copies of these crates, and an app that builds Rune has to patch
# them too. Keep the rev the same as the `rune` dependency above.
[build-dependencies]
embed-resource = "3"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "c9ae2f6ec08147fc5c72760bbf09a6acd4a27dc3" }
winit = { git = "https://github.com/anomalyco/rune", rev = "c9ae2f6ec08147fc5c72760bbf09a6acd4a27dc3" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "c9ae2f6ec08147fc5c72760bbf09a6acd4a27dc3" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "c9ae2f6ec08147fc5c72760bbf09a6acd4a27dc3" }

[profile.release]
codegen-units = 16
